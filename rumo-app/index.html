<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1A2B" media="(prefers-color-scheme: dark)">
<meta name="description" content="Monte sua viagem em 1 minuto: quiz, pacotes, orçamento, cofre, roteiro e mala.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rumo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Rumo Viagem</title>
<style>html{padding-top:env(safe-area-inset-top,0px);color-scheme:light}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: estilo app de reservas — barra superior com "pílula" da viagem, abas no topo no desktop e barra inferior no celular; cards grandes com ilustrações animadas de praia. Paleta "meio-dia na praia" (claro) e "pôr do sol" (escuro). */
:root{
  --bg:#FFFFFF; --bg2:#F2FAFB; --card:#FFFFFF; --ink:#13213C; --muted:#5E6B7C; --line:#E4EBEF;
  --ocean:#00A3B5; --ocean-d:#007E8E; --ocean-soft:#DDF5F7; --coral:#FF6450; --coral-d:#E84A36; --coral-soft:#FFE7E2; --sun:#FFBE2E; --sun-soft:#FFF3D3; --mint:#21B07A; --mint-soft:#DDF6EC; --grape:#7C5CFF;
  --sky1:#62CDF0; --sky2:#D5F4FB; --sea1:#35C6D6; --sea2:#14A6BF; --sea3:#0B83A2; --sand:#FBE1B2; --sand2:#F4CF8E; --hill1:#3BB273; --hill2:#2A9461; --cloud:#FFFFFF; --sunc:#FFC93C;
  --shadow:0 8px 28px rgba(19,33,60,.08); --shadow-h:0 14px 36px rgba(19,33,60,.14);
  --f-d:"Fredoka","Trebuchet MS",system-ui,sans-serif; --f-b:"Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A2B; --bg2:#13243A; --card:#152A42; --ink:#EEF5F8; --muted:#A3B4C4; --line:#24405C;
  --ocean:#33D3E3; --ocean-d:#1FB7C8; --ocean-soft:#14394A; --coral:#FF7A66; --coral-d:#FF8E7C; --coral-soft:#43242A; --sun:#FFC94D; --sun-soft:#3E331A; --mint:#45D49A; --mint-soft:#163C30; --grape:#9C85FF;
  --sky1:#2A2F6B; --sky2:#FF9A76; --sea1:#2B6E9C; --sea2:#1E557F; --sea3:#163F63; --sand:#C79A6B; --sand2:#B0855A; --hill1:#2D6B5A; --hill2:#22564A; --cloud:#FFD6C4; --sunc:#FFB45E;
  --shadow:0 8px 28px rgba(0,0,0,.35); --shadow-h:0 14px 36px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A2B; --bg2:#13243A; --card:#152A42; --ink:#EEF5F8; --muted:#A3B4C4; --line:#24405C;
  --ocean:#33D3E3; --ocean-d:#1FB7C8; --ocean-soft:#14394A; --coral:#FF7A66; --coral-d:#FF8E7C; --coral-soft:#43242A; --sun:#FFC94D; --sun-soft:#3E331A; --mint:#45D49A; --mint-soft:#163C30; --grape:#9C85FF;
  --sky1:#2A2F6B; --sky2:#FF9A76; --sea1:#2B6E9C; --sea2:#1E557F; --sea3:#163F63; --sand:#C79A6B; --sand2:#B0855A; --hill1:#2D6B5A; --hill2:#22564A; --cloud:#FFD6C4; --sunc:#FFB45E;
  --shadow:0 8px 28px rgba(0,0,0,.35); --shadow-h:0 14px 36px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.5;margin:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,.disp{font-family:var(--f-d);text-wrap:balance;margin:0;line-height:1.1;font-weight:600}
h2{font-size:1.6rem}h3{font-size:1.15rem}
p{margin:0}a{color:var(--ocean-d)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:.86rem}.tiny{font-size:.76rem}
.ic{flex:none;display:block}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:14px;justify-content:space-between}
.logo{display:flex;align-items:center;gap:7px;font-family:var(--f-d);font-weight:700;font-size:1.45rem;color:var(--coral);text-decoration:none;flex:none}
.logo .sunlogo{animation:spin 18s linear infinite}
.topnav{display:none;gap:4px}
.topnav button{border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:700;color:var(--muted);cursor:pointer}
.topnav button[aria-current="page"]{color:var(--ink);background:var(--bg2)}
.pill{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 6px 6px 14px;box-shadow:var(--shadow);cursor:pointer;min-width:0;max-width:100%}
.pill:hover{box-shadow:var(--shadow-h)}
.pill .t{display:flex;flex-direction:column;line-height:1.15;min-width:0;text-align:left}
.pill b{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill span.s{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .go{width:34px;height:34px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;flex:none}
#instalar{border:0;background:var(--sun);color:#3A2600;font-weight:800;border-radius:999px;padding:7px 12px;cursor:pointer;font-size:.82rem}
.offline{font-size:.72rem;font-weight:800;color:var(--coral)}

/* barra inferior */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bottom-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto}
.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:.7rem;font-weight:700;color:var(--muted);cursor:pointer}
.bottom button[aria-current="page"]{color:var(--coral)}
.bottom button[aria-current="page"] .ic{transform:translateY(-1px) scale(1.08)}
@media (min-width:900px){.topnav{display:flex}.bottom{display:none}main{padding-bottom:60px!important}}

main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px;display:flex;flex-direction:column;gap:26px}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.sec-h p{max-width:60ch}
.kicker{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--coral)}

/* cards e botões */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.soft{background:var(--bg2);box-shadow:none;border-color:transparent}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:11px 16px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s,border-color .15s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.cta{background:linear-gradient(135deg,var(--coral),#FF8A3D);border:0;color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--coral) 35%,transparent)}
.btn.cta:hover{box-shadow:0 12px 26px color-mix(in srgb,var(--coral) 45%,transparent)}
.btn.sea{background:var(--ocean);border-color:var(--ocean);color:#fff}
.btn.sm{padding:7px 12px;font-size:.84rem;border-radius:11px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.block{width:100%}
.chip.wrap{white-space:normal}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:.76rem;font-weight:800;background:var(--bg2);color:var(--ink);white-space:nowrap}
.chip.sun{background:var(--sun-soft)}.chip.coral{background:var(--coral-soft);color:var(--coral-d)}.chip.mint{background:var(--mint-soft);color:var(--mint)}.chip.sea{background:var(--ocean-soft);color:var(--ocean-d)}
.est{font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sun);background:var(--sun-soft);padding:1px 6px;border-radius:6px;vertical-align:middle}

/* hero */
.hero{position:relative;border-radius:28px;overflow:hidden;box-shadow:var(--shadow);min-height:330px;display:flex}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%}
.hero-c{position:relative;padding:24px;display:flex;flex-direction:column;gap:12px;justify-content:space-between;width:100%}
.hero h1{font-size:clamp(2.2rem,7vw,3.6rem);font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.hero .lead{max-width:34ch;font-weight:600;color:var(--ink)}
.count{display:inline-flex;align-items:baseline;gap:6px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(6px);padding:8px 14px;border-radius:16px;font-weight:800;align-self:flex-start}
.count b{font-family:var(--f-d);font-size:1.7rem;color:var(--coral);line-height:1}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.glass{background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(8px);border:0}

/* categorias */
.cats{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;border-bottom:1px solid var(--line)}
.cats::-webkit-scrollbar{display:none}
.cat{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 2px 10px;color:var(--muted);font-weight:700;font-size:.8rem;cursor:pointer;border-bottom:2.5px solid transparent;flex:none}
.cat[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.cat:hover{color:var(--ink)}

/* pacotes */
.pkgs{display:grid;gap:24px 18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.pkg{cursor:pointer;display:flex;flex-direction:column;gap:8px;border:0;background:none;text-align:left;padding:0}
.thumb{position:relative;aspect-ratio:4/3;border-radius:20px;overflow:hidden;max-width:100%;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s}
.pkg:hover .thumb{transform:translateY(-3px);box-shadow:var(--shadow-h)}
.thumb svg.scene{width:100%;height:100%;display:block}
.fav{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#13213C;display:grid;place-items:center;cursor:pointer}
.fav[aria-pressed="true"]{color:#FF4D5E}
.fav[aria-pressed="true"] svg{fill:#FF4D5E;animation:pop .35s}
.badge{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.94);color:#13213C;font-weight:800;font-size:.74rem;padding:5px 10px;border-radius:999px}
.pkg h3{font-size:1.08rem}
.price b{font-size:1.02rem}

/* destinos rolantes */
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.dcard{border:0;padding:0;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);text-align:left;cursor:pointer;display:flex;flex-direction:column;border:2px solid transparent}
.dcard[aria-pressed="true"]{border-color:var(--coral)}
.dcard .thumb{border-radius:0;box-shadow:none;aspect-ratio:16/9}
.dcard .in{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px}

/* segmentado */
.seg2{display:inline-flex;background:var(--bg2);border-radius:999px;padding:4px;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg2 button{border:0;background:none;border-radius:999px;padding:8px 14px;font-weight:800;font-size:.86rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg2 button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}

/* níveis */
.tiers{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.tier{padding:0;overflow:hidden;gap:0}
.tier .band{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;color:#13213C}
.tier.t0 .band{background:linear-gradient(120deg,#FFE29A,#FFC94D)}
.tier.t1 .band{background:linear-gradient(120deg,#8FE9F2,#3CCAD8)}
.tier.t2 .band{background:linear-gradient(120deg,#FFB3A6,#FF7A66)}
.tier .band .nick{font-family:var(--f-d);font-size:1.25rem;font-weight:700}
.tier .band .lvl{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;opacity:.8}
.tier .bico{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.55);display:grid;place-items:center}
.tier .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.tier .total{font-family:var(--f-d);font-size:2.2rem;font-weight:700;line-height:1}
.tier.sel{outline:3px solid var(--coral);outline-offset:-3px}
.lines{display:flex;flex-direction:column;font-size:.88rem}
.line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}
.line small{display:block;color:var(--muted);font-size:.77rem}
.sbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--bg2)}
.sbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:4px}
details.more summary{cursor:pointer;font-weight:800;font-size:.86rem;color:var(--ocean-d);list-style:none}
details.more summary::-webkit-details-marker{display:none}

/* tabela */
.tbl{overflow-x:auto;border-radius:18px;border:1px solid var(--line);background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:540px;font-size:.9rem}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--bg2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.cur td{background:var(--ocean-soft)}tr:last-child td{border-bottom:0}

/* checks */
.chk{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.chk:first-child{border-top:0}
.chk input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;margin:0;display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.chk input:checked{background:var(--mint);border-color:var(--mint);animation:pop .3s}
.chk input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk.done span.tx{text-decoration:line-through;color:var(--muted)}
.ring{--p:0;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--mint) calc(var(--p)*1%),var(--bg2) 0);display:grid;place-items:center;flex:none}
.ring span{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:.72rem;font-weight:800}

/* switch */
.sw{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.sw:first-of-type{border-top:0}
.sw input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked{background:var(--mint)}.sw input:checked::after{transform:translateX(18px)}
.save{font-weight:800;color:var(--mint);white-space:nowrap}

/* roteiro */
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dchip{flex:none;width:60px;border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:8px 0;display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative}
.dchip .w{font-size:.68rem;font-weight:800;text-transform:uppercase;color:var(--muted)}
.dchip .d{font-family:var(--f-d);font-size:1.35rem;font-weight:700;line-height:1.1}
.dchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dchip[aria-pressed="true"] .w{color:inherit;opacity:.8}
.dchip .dot{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--coral)}
.tl{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:start;position:relative;padding-bottom:16px}
.tli:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.tico{width:44px;height:44px;border-radius:15px;display:grid;place-items:center}
.tag-viagem{background:var(--ocean-soft);color:var(--ocean-d)}.tag-praia{background:var(--sun-soft);color:#B07800}.tag-passeio{background:var(--coral-soft);color:var(--coral-d)}.tag-noite{background:#ECE7FF;color:var(--grape)}.tag-base{background:var(--mint-soft);color:var(--mint)}.tag-livre,.tag-custom{background:var(--bg2);color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag-noite{background:#2A2550}:root:not([data-theme="light"]) .tag-praia{color:var(--sun)}}
:root[data-theme="dark"] .tag-noite{background:#2A2550}:root[data-theme="dark"] .tag-praia{color:var(--sun)}
.tli .h{font-size:.8rem;font-weight:800;color:var(--muted)}
.tli .t{font-weight:700}
.tli.done .t{text-decoration:line-through;color:var(--muted)}
.tli .chk{border:0;padding:6px 0 0}

/* cofre */
.jarwrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.jar{width:150px;flex:none}
.jar .water{transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-width:220px}
.kpi b{display:block;font-family:var(--f-d);font-size:1.5rem;font-weight:700;line-height:1.15}
.kpi span{font-size:.78rem;color:var(--muted);font-weight:700}
.bar{height:9px;border-radius:999px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--ocean);transition:width .6s}
.bar.over i{background:var(--coral)}

/* formulários */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:.84rem;min-width:0}
input[type=text],input[type=number],input[type=date],select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);min-width:0}
input:focus,select:focus{border-color:var(--ocean);outline:none}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{cursor:pointer;position:relative}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1.5px solid var(--line);border-radius:999px;font-weight:800;font-size:.88rem;background:var(--card)}
.opts input:checked+span{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.opts input:focus-visible+span{outline:3px solid var(--sun)}
.person{display:grid;grid-template-columns:1fr 84px auto;gap:8px;align-items:end}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:800;display:grid;place-items:center}
.stepper button:hover{border-color:var(--ink)}
.stepper span{min-width:20px;text-align:center;font-weight:800}
.act{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.note{border-radius:18px;padding:14px 16px;background:var(--sun-soft);font-size:.92rem;display:flex;gap:12px;align-items:flex-start}
.note.sea{background:var(--ocean-soft)}.note.coral{background:var(--coral-soft)}
.emerg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.emerg div{background:var(--bg2);border-radius:16px;padding:14px}
.emerg b{display:block;font-family:var(--f-d);font-size:2rem;color:var(--coral);line-height:1;user-select:all}
ul.cl,ol.cl{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}

/* quiz e folhas */
.overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.quiz{background:linear-gradient(180deg,color-mix(in srgb,var(--sky1) 32%,var(--bg)),var(--bg) 60%)}
.q-top{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));max-width:640px;width:100%;margin:0 auto}
.xbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;flex:none}
.track{flex:1;height:10px;border-radius:999px;background:color-mix(in srgb,var(--card) 70%,transparent);position:relative}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--ocean),var(--coral));transition:width .45s cubic-bezier(.2,.8,.2,1)}
.track .boat{position:absolute;top:-17px;transition:left .45s cubic-bezier(.2,.8,.2,1);color:var(--coral)}
.q-body{max-width:640px;width:100%;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.q-anim{animation:qin .45s cubic-bezier(.2,.8,.2,1)}
.q-step{font-weight:800;font-size:.8rem;color:var(--coral);letter-spacing:.06em;text-transform:uppercase}
.q-body h1{font-size:clamp(1.8rem,6vw,2.5rem);font-weight:700}
.q-opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.qo{border:2px solid transparent;background:var(--card);border-radius:20px;padding:14px;display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,border-color .15s,box-shadow .15s}
.qo:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
.qo[aria-pressed="true"]{border-color:var(--coral)}
.qo .qi{width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
.qo b{display:block;font-size:1rem;color:var(--ink)}
.qo span{font-size:.84rem;color:var(--muted)}
.qo.pic{grid-template-columns:1fr;padding:0;overflow:hidden}
.qo.pic .thumb{border-radius:0;box-shadow:none;aspect-ratio:16/8}
.qo.pic .in{padding:10px 14px 14px}
.slider{width:100%;accent-color:var(--coral);height:30px}
.money{font-family:var(--f-d);font-size:3rem;font-weight:700;color:var(--coral);line-height:1}
.q-foot{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--ocean-d);font-weight:800;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.res-hero{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:16/10;max-width:100%;box-shadow:var(--shadow-h)}
.res-hero svg{width:100%;height:100%;display:block}
.res-hero .tag{position:absolute;left:14px;bottom:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:49;animation:fade .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:0 0 calc(20px + env(safe-area-inset-bottom,0px));animation:up .35s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:10px auto}
.sheet .in{padding:6px max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;font-size:.9rem;z-index:60;animation:up .3s;white-space:nowrap}
#confete{position:fixed;inset:0;pointer-events:none;z-index:70}

/* animações */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes qin{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translate(var(--tx,0),40px);opacity:0}to{transform:translate(var(--tx,0),0);opacity:1}}
.toast{--tx:-50%}
@keyframes fade{from{opacity:0}}
@keyframes wave{to{transform:translateX(-200px)}}
@keyframes drift{0%{transform:translateX(0)}50%{transform:translateX(34px)}100%{transform:translateX(0)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
@keyframes glow{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.15);opacity:.2}}
@keyframes jet{0%{transform:translateX(-60px)}100%{transform:translateX(440px)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
.scene .w1{animation:wave 11s linear infinite}.scene .w2{animation:wave 8s linear infinite reverse}.scene .w3{animation:wave 6s linear infinite}
.scene .cl{animation:drift 14s ease-in-out infinite}.scene .cl2{animation:drift 19s ease-in-out infinite reverse}
.scene .bob{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.scene .glow{animation:glow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.scene .jet{animation:jet 12s linear infinite}
.scene .sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

const ORDEM=['floripa','litsul','litnorte','regiao'];

/* ===================== ESTADO ===================== */
const K='rumo-viagem-v1';
function defAtiv(did,tipo,querJet){const o={};for(const a of DEST[did].ativ){if(a.id==='jet60')continue;if(a.tags.includes(tipo)||(a.id==='jet30'&&querJet))o[a.id]=1}return o}
function def(){return{origem:'Curitiba',inicio:'2027-01-04',fim:'2027-01-18',destino:'floripa',pessoas:[{nome:'Você',idade:30},{nome:'Acompanhante',idade:30}],tipo:'aventura',transporte:'carro',hosp:'comparar',temEquip:false,querJet:true,teto:10000,tier:'intermediario',kml:11,gas:6.4,ativ:defAtiv('floripa','aventura',true),econ:{},depositos:[],gastos:[],checks:{},rt:null,exemplo:true}}
let st;try{st=JSON.parse(localStorage.getItem(K))}catch(e){st=null}
if(!st||!st.pessoas)st=def();
function save(){try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}}

/* ===================== UTIL ===================== */
const brl=v=>(Math.round(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const WD=['dom','seg','ter','qua','qui','sex','sáb'];const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const fd=d=>`${WD[d.getDay()]}, ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
const fdl=d=>`${d.getDate()} ${MES[d.getMonth()]}`;
const hoje=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const diff=(a,b)=>Math.round((b-a)/864e5);
function noites(){const n=diff(pd(st.inicio),pd(st.fim));return Math.max(1,n||1)}
function diasLista(){const out=[];const a=pd(st.inicio);for(let i=0;i<=noites();i++)out.push(addD(a,i));return out}
const P=()=>Math.max(1,st.pessoas.length);
const kids=()=>st.pessoas.filter(p=>+p.idade<12).length;
const maps=q=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
const tierIdx=t=>TIERS.indexOf(t);
function hospTipo(t){return st.hosp==='comparar'?{economico:'camping',intermediario:'airbnb',premium:'hotel'}[t]:st.hosp}
function hospNoite(D,t,ti,p){if(t==='gratis')return 0;if(t==='hotel')return Math.ceil(p/2)*D.hotel[ti];if(t==='airbnb')return D.airbnb[ti]*(p<=4?1:1+.25*Math.ceil((p-4)/2));return ti<2?p*D.camp[ti]:Math.ceil(p/2)*D.glamp}
function ativDe(did){return did===st.destino?st.ativ:defAtiv(did,st.tipo,st.querJet)}
function grupoLabel(){const p=P(),k=kids();if(p===1)return'Viagem solo';if(k)return`${p} pessoas, ${k} criança${k>1?'s':''}`;if(p===2)return'2 pessoas';return`${p} pessoas`}

/* ===================== MOTOR DE ORÇAMENTO ===================== */
function transporteCusto(D,ti,modo,days){const p=P(),carros=Math.ceil(p/5);
 if(modo==='carro'){const km=D.km*2+(D.kmExtra||0);return{ida:km/st.kml*st.gas*carros+D.ped*2*carros,local:[20,35,60][ti]*days*carros,km,carros,taxa:(D.taxaDia||0)*days*carros}}
 if(modo==='carona'){const km=D.km*2+(D.kmExtra||0);return{ida:km*CARONA[ti]*p,local:[12*p,70,220][ti]*days,km,carros:0,taxa:0}}
 return{ida:D.bus*2*p,local:[12*p,70,220][ti]*days,km:0,carros:0,taxa:0}}
const caronaTrecho=(D,ti)=>D.km*CARONA[ti];
function calc(did,tier){
 const D=DEST[did],ti=tierIdx(tier),N=noites(),days=N+1,p=P(),k=kids(),eq=p-k+k*.6;
 const tr=transporteCusto(D,ti,st.transporte,days);
 const ht=hospTipo(tier);const nP=did==='regiao'?Math.min(N,D.noitesFora):N;
 const at=ativDe(did);let pas=0;const lista=[];
 for(const[id,q]of Object.entries(at)){const a=D.ativ.find(x=>x.id===id);if(!a||!q)continue;const v=a.p*(a.u==='jet'?Math.ceil(p/2):a.u==='pessoa'?p:1)*q;pas+=v;lista.push({a,q,v})}
 let tx=tr.taxa;const txd=[];if(tr.taxa)txd.push('taxa ambiental de Ubatuba');
 if(did==='regiao'&&at.ilhamel&&st.transporte==='carro'){tx+=40*3*tr.carros;txd.push('estacionamento em Pontal do Sul')}
 const L={
  ida:{c:'transporte',n:'Ida e volta',v:tr.ida,d:st.transporte==='carro'?`${tr.km} km de estrada, combustível e pedágios`:st.transporte==='carona'?`Carona BlaBlaCar, cerca de ${brl(caronaTrecho(D,ti))} por trecho por pessoa`:`Ônibus, ${brl(D.bus)} por trecho por pessoa`},
  local:{c:'transporte',n:'Transporte no destino',v:tr.local,d:st.transporte==='carro'?'Combustível local e estacionamentos':['Ônibus urbano','Aplicativo de transporte','Carro alugado no destino'][ti]},
  taxas:{c:'transporte',n:'Taxas',v:tx,d:txd.join(' e ')||'Sem taxas obrigatórias'},
  hosp:{c:'hosp',n:'Hospedagem',v:hospNoite(D,ht,ti,p)*nP,d:`${HOSPN[ht][ti]}, ${nP} noite${nP>1?'s':''}`+(did==='regiao'?' fora de casa':'')},
  comida:{c:'comida',n:'Alimentação',v:D.food[ti]*eq*days,d:`${brl(D.food[ti])} por pessoa por dia`},
  passeios:{c:'passeios',n:'Passeios',v:pas,d:lista.length?lista.map(x=>x.a.n).join(', '):'Nenhum passeio pago escolhido'},
  lazer:{c:'extras',n:'Extras do dia',v:[0,25,80][ti]*p*days,d:ti?'Cadeira de praia, sorvete, lembranças':'Sem extras no plano básico'},
  equip:{c:'extras',n:'Kit de camping',v:((ht==='camping'&&ti<2)||ht==='gratis')&&!st.temEquip?680+210*p:0,d:'Compra única: o equipamento fica com você'}
 };
 const sub=Object.values(L).reduce((s,x)=>s+x.v,0);
 L.reserva={c:'extras',n:'Reserva para imprevistos',v:sub*.08,d:'8% do total'};
 const total=sub+L.reserva.v;
 return{did,tier,ti,L,total,ht,nP,days,N,tr,lista}}
function porCat(C){const o={transporte:0,hosp:0,comida:0,passeios:0,extras:0};for(const x of Object.values(C.L))o[x.c]+=x.v;return o}

function economias(C){
 const D=DEST[C.did],p=P(),out=[],L=C.L,ti=C.ti,days=C.days;
 if(C.ht!=='hotel')out.push({id:'cozinhar',n:'Cozinhar café da manhã e jantar',d:'Sua hospedagem tem cozinha. Mercado custa bem menos que restaurante.',v:L.comida.v*.35});
 else out.push({id:'cozinhar',n:'Escolher hospedagem com café da manhã incluso',d:'Uma refeição a menos por dia na rua.',v:L.comida.v*.15});
 out.push({id:'lanche',n:'Levar lanche, água e cooler para a praia',d:'Quiosque de praia em janeiro cobra caro por água e petisco.',v:Math.min(20*p*days,L.comida.v*.15)});
 const atual=L.ida.v+L.local.v+L.taxas.v;let best=null;
 for(const m of ['carona','onibus','carro']){if(m===st.transporte)continue;const t2=transporteCusto(D,ti,m,days);const alt=t2.ida+t2.local+t2.taxa;if(!best||alt<best.alt)best={m,alt}}
 if(best&&atual-best.alt>30)out.push({id:'modo',n:{carona:'Ir de carona pelo BlaBlaCar',onibus:'Ir de ônibus e usar transporte público',carro:'Ir de carro e dividir combustível'}[best.m],d:`O meio de transporte mais barato para ${grupoLabel().toLowerCase()} nesse destino.`,v:atual-best.alt});
 if(st.transporte!=='carro'&&ti>0)out.push({id:'busurb',n:'Usar ônibus urbano no destino',d:'Troca aplicativo ou carro alugado por ônibus.',v:L.local.v-12*p*days});
 if(C.ht!=='camping'&&C.ht!=='gratis'){const v=L.hosp.v-p*D.camp[1]*C.nP;if(v>0)out.push({id:'acampar',n:'Trocar a hospedagem por camping com estrutura',d:'Banheiro quente, cozinha e energia, pagando por pessoa.',v})}
 if(C.ht!=='gratis'&&L.hosp.v>0)out.push({id:'gratis',n:'Acampar de graça em parte das noites',d:'Metade das noites em voluntariado ou ponto gratuito. Veja as opções em Hospedagem.',v:L.hosp.v*.5});
 if(L.equip.v>0)out.push({id:'emprestar',n:'Pegar barraca e equipamento emprestados',d:'Ou alugue barraca e colchão no próprio camping.',v:L.equip.v*.8});
 if(st.ativ.jet60&&C.did===st.destino){const a30=D.ativ.find(a=>a.id==='jet30'),a60=D.ativ.find(a=>a.id==='jet60');if(a30&&a60)out.push({id:'jet',n:'Jet ski de 30 min em vez de 1 hora',d:'Meia hora já dá para curtir bem, ainda mais dividindo o jet.',v:(a60.p-a30.p)*Math.ceil(p/2)*st.ativ.jet60})}
 if(C.N>4)out.push({id:'noites',n:'Encurtar a viagem em 2 noites',d:'Volta antes e economiza hospedagem, comida e extras.',v:(L.hosp.v/C.nP+L.comida.v/days+L.lazer.v/days)*2});
 out.push({id:'antecedencia',n:'Reservar a hospedagem até 15 de dezembro',d:'Estimativa. Em janeiro o que sobra fica mais caro.',v:L.hosp.v*.1});
 if(ti>0)out.push({id:'extras',n:'Cortar os extras do dia pela metade',d:'Menos lembrancinha, sorvete e cadeira alugada.',v:L.lazer.v*.5});
 return out.filter(e=>e.v>5)}
function plano(){const C=calc(st.destino,st.tier);const E=economias(C);const eco=E.filter(e=>st.econ[e.id]).reduce((s,e)=>s+e.v,0)*1.08;return{C,E,eco,meta:Math.max(0,C.total-eco)}}

/* ===================== ROTEIRO ===================== */
function sigRt(){return JSON.stringify([st.destino,st.inicio,st.fim,st.tipo,st.ativ,st.transporte,st.hosp,st.tier])}
function gerarRoteiro(){
 const D=DEST[st.destino],ds=diasLista(),car=st.transporte==='carro',cr=st.transporte==='carona',ht=hospTipo(st.tier),camp=ht==='camping'||ht==='gratis';
 const at=Object.entries(st.ativ).filter(([,q])=>q>0).flatMap(([id,q])=>Array(q).fill(D.ativ.find(a=>a.id===id))).filter(Boolean);
 const dia=at.filter(a=>a.per==='dia'),meia=at.filter(a=>a.per==='manha'||a.per==='tarde'),noite=at.filter(a=>a.per==='noite');
 const jet=meia.findIndex(a=>a.id.startsWith('jet'));let jetA=null;if(jet>=0)jetA=meia.splice(jet,1)[0];
 const days=ds.map(d=>({date:iso(d),items:[]}));const last=days.length-1;let praia=0;
 const nextPraia=()=>D.praias[(praia++)%D.praias.length];
 const it=(h,t,tag)=>({h,t,tag:tag||'',done:false});
 days[0].items.push(car?it('05:30','Saída de casa. Saia antes das 6h para pegar a estrada vazia','viagem'):cr?it('06:00','Encontro com o motorista da carona no ponto combinado','viagem'):it('06:30','Ônibus na rodoviária. Chegue 40 min antes','viagem'));
 days[0].items.push(it(car?'10:30':'12:00',`Chegada a ${D.curto}. ${car?'Parada no caminho para café e combustível':'Siga de app ou ônibus até a hospedagem'}`,'viagem'));
 days[0].items.push(it('14:00',camp?'Check-in no camping e montar a barraca antes de escurecer':'Check-in e mercado para os primeiros dias','base'));
 days[0].items.push(it('17:00',`Primeira praia sem pressa: ${nextPraia()}`,'praia'));
 days[0].items.push(it('20:00',D.noites[st.tipo],'noite'));
 const meio=[];for(let i=1;i<last;i++)meio.push(i);
 if(jetA&&meio.length){const i=meio[Math.min(1,meio.length-1)];days[i].items.push(it('09:00',`${jetA.n} em ${jetA.onde}. Reserva confirmada; manhã tem mar mais calmo`,'passeio'),it('14:00',`Praia: ${nextPraia()}`,'praia'))}
 const livres=meio.filter(i=>!days[i].items.length);let di=0;
 for(const a of dia){const i=livres[di++];if(i==null)break;days[i].items.push(it('08:00',`${a.n} (${a.onde})`,'passeio'))}
 let slot=livres.slice(di);let si=0;
 for(const a of meia){const i=slot[Math.floor(si/2)];if(i==null)break;const man=si%2===0;days[i].items.push(it(man?'09:00':'14:30',`${a.n} (${a.onde})`,'passeio'));si++}
 meio.forEach((i,n)=>{const d=days[i];const m=d.items.some(x=>x.h<'12:00'),t=d.items.some(x=>x.h>='12:00'&&x.h<'19:00')||d.items.some(x=>x.h==='08:00');
  if((n+1)%5===0&&!d.items.length){d.items.push(it('09:00','Dia livre e de descanso. Se chover: '+D.chuva,'livre'));return}
  if(!m&&!d.items.some(x=>x.h==='08:00'))d.items.push(it('09:00',`Praia: ${nextPraia()}`,'praia'));
  if(!t)d.items.push(it('15:00',n%3===2?'Tarde livre: cochilo, lavar roupa, repor o mercado':`Praia: ${nextPraia()}`,'praia'));});

 const at=Object.keys(ps.ativ).map(k=>D.ativ.find(a=>a.id===k)).filter(Boolean);
 abrirFolha(`<div class="res-hero">${scene(p.dest)}<div class="tag"><span class="chip sun">${NICK[p.tier]}</span><button class="xbtn" data-act="fechar" aria-label="Fechar">${ic('x',18)}</button></div></div>

 <div class="row between"><div><div class="disp num" style="font-size:2rem">${brl(C.total/P())}</div><span class="small muted">por pessoa · total ${brl(C.total)} para ${P()}</span></div><span class="chip ${C.total<=st.teto?'mint':'coral'}">${C.total<=st.teto?'Cabe no bolso':'Passa do teto'}</span></div>

 const base={pessoas:pess,inicio:a.inicio,fim:a.fim,tipo:a.tipo,querJet:a.jet!=='nao',hosp:a.hosp,transporte:a.transporte,teto:a.teto};
 let dest=a.destino;
 if(dest==='surpresa'){const cand=ORDEM.map(d=>comOverride({...base,destino:d,ativ:defAtiv(d,a.tipo,a.jet!=='nao')},()=>{const t=melhorNivel(d);const tot=calc(d,t).total;return{d,fits:tot<=a.teto,tot,sc:tierIdx(t)*10+(a.jet!=='nao'&&DEST[d].ativ.some(x=>x.id==='jet30')?4:0)+DEST[d].ativ.filter(x=>x.tags.includes(a.tipo)).length+(d==='floripa'?2:0)}}));const ok=cand.filter(c=>c.fits);dest=ok.length?ok.sort((x,y)=>y.sc-x.sc)[0].d:cand.sort((x,y)=>x.tot-y.tot)[0].d}
 const ativ=defAtiv(dest,a.tipo,a.jet!=='nao');
 const tier=comOverride({...base,destino:dest,ativ},()=>melhorNivel(dest));
 return{...base,destino:dest,ativ,tier,pacote:`${SHORT[dest]} ${APEL[a.tipo]}`}}

 else if(i===4)h=head('Onde você quer acordar?','Do raiz ao luxo, tudo vale.')+`<div class="q-opts">${opt('hosp','camping','Barraca com som de onda','Camping com banho quente e cozinha','tent','mint',a.hosp==='camping')}${opt('hosp','gratis','Barraca de graça, sou raiz','Voluntariado ou ponto gratuito','free','sun',a.hosp==='gratis')}${opt('hosp','airbnb','Apê com cozinha','Pra fazer meu miojo gourmet','house','sea',a.hosp==='airbnb')}${opt('hosp','hotel','Hotel com café da manhã','E sem lavar a louça','hotel','coral',a.hosp==='hotel')}${opt('hosp','comparar','Tanto faz, me surpreenda','Eu comparo tudo pra você','spark','grape',a.hosp==='comparar')}</div>`;
 else if(i===5)h=head('Como a gente chega lá?',`Saindo de ${esc(st.origem)}.`)+`<div class="q-opts">${opt('transporte','carro','Meu carro, minha playlist','Liberdade pra parar onde quiser','car','coral',a.transporte==='carro')}${opt('transporte','carona','Carona e amigos novos','BlaBlaCar, barato na estrada','ride','mint',a.transporte==='carona')}${opt('transporte','onibus','Ônibus e cochilo na janela','Sem dirigir e sem pedágio','bus','sea',a.transporte==='onibus')}</div>`;

 else if(i===7)h=head('Quanto o bolso aguenta sem chorar?','Valor total da viagem, para o grupo todo.')+`<div class="card" style="align-items:center;text-align:center"><span class="chip sun">${bolsoNome(a.teto)}</span><div class="money num">${brl(a.teto)}</div><span class="small muted">${brl(a.teto/(a.grupo==='solo'?1:a.grupo==='casal'?2:a.n))} por pessoa</span><input class="slider" type="range" id="q-teto" min="1000" max="40000" step="500" value="${a.teto}" aria-label="Orçamento total"><div class="row between small muted" style="width:100%"><span>Miojo</span><span>Pastel</span><span>Camarão</span><span>Lagosta</span></div></div><button class="btn cta" data-qnext>Ver meu pacote ${ic('spark',18)}</button>`;
 else{const s=qState(a);const C=comOverride(s,()=>calc(s.destino,s.tier));const D=DEST[s.destino];const at=Object.keys(s.ativ).map(k=>D.ativ.find(x=>x.id===k)).filter(Boolean).slice(0,4);const pp=C.total/s.pessoas.length;const cabe=C.total<=s.teto;

  <button class="btn cta block" data-qfinal>${ic('check',18)} Fechar esse pacote</button><button class="linkbtn" data-qrestart>Refazer o quiz</button>`}
 const pct=Math.min(100,i/8*100);
 o.innerHTML=`<div class="q-top"><button class="xbtn" data-qclose aria-label="Fechar o quiz">${ic('x',18)}</button><div class="track"><i style="width:${pct}%"></i><span class="boat" style="left:max(0px,calc(${pct}% - 24px))">${ic('boat',24)}</span></div>${i>0&&i<8?`<button class="xbtn" data-qback aria-label="Voltar">${ic('arrow',18).replace('M5 12h14M13 6l6 6-6 6','M19 12H5M11 6l-6 6 6 6')}</button>`:''}</div>
 <div class="q-body q-anim">${h}${i<8?`<div class="q-foot"><button class="linkbtn" data-qpronto>Prefiro um pacote pronto</button></div>`:''}</div>`;

function confete(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=$('#confete');c.hidden=false;const W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';const x=c.getContext('2d');const cs=['#FF6450','#FFBE2E','#00A3B5','#21B07A','#7C5CFF','#FF8A3D'];
 const ps=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*22*devicePixelRatio,vy:(-Math.random()*20-6)*devicePixelRatio,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,w:(6+Math.random()*7)*devicePixelRatio,h:(4+Math.random()*5)*devicePixelRatio,c:cs[Math.floor(Math.random()*cs.length)]}));
 const t0=performance.now();(function f(t){x.clearRect(0,0,W,H);for(const p of ps){p.vy+=.6*devicePixelRatio;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}if(t-t0<2600)requestAnimationFrame(f);else{x.clearRect(0,0,W,H);c.hidden=true}})(t0)}

document.addEventListener('click',e=>{
 const t=e.target;
 if(qz){const q=t.closest('[data-qa],[data-qnext],[data-qclose],[data-qback],[data-qpronto],[data-qfinal],[data-qrestart],[data-qn]');if(q){
  if(q.dataset.qclose!=null){fecharQuiz();return}

   q.closest('.q-opts').querySelectorAll('.qo').forEach(b=>b.setAttribute('aria-pressed',b===q));setTimeout(()=>{if(qz){qz.i++;rQuiz()}},260);return}}
  return}
 const g=t.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);return}
 const fv=t.closest('[data-fav]');if(fv){e.stopPropagation();const id=fv.dataset.fav;if(st.fav[id])delete st.fav[id];else st.fav[id]=1;save();fv.setAttribute('aria-pressed',!!st.fav[id]);if(st.fav[id])toast('Salvo nos favoritos');return}

 const b=t.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='tema'){st.tema={auto:'claro',claro:'escuro',escuro:'auto'}[st.tema];save();aplicarTema();toast(TEMAS[st.tema][1])}
 else if(a==='quiz')abrirQuiz();
 else if(a==='fechar')fecharFolha();
 else if(a==='usarpkg')usarPacote(PACOTES.find(p=>p.id===b.dataset.v));
 else if(a==='tier'){st.tier=b.dataset.v;upd(NICK[st.tier]+': esse é o seu plano')}
 else if(a==='dest'){st.destino=b.dataset.v;st.ativ=defAtiv(st.destino,st.tipo,st.querJet);st.pacote='';diaSel=null;upd('Partiu '+SHORT[st.destino]+'!')}
 else if(a==='addp'){st.pessoas.push({nome:'Pessoa '+(st.pessoas.length+1),idade:30});upd()}
 else if(a==='delp'){st.pessoas.splice(+b.dataset.i,1);upd()}
 else if(a==='aq'){const id=b.dataset.id;st.ativ[id]=Math.max(0,Math.min(9,(st.ativ[id]||0)+ +b.dataset.d));if(!st.ativ[id])delete st.ativ[id];upd()}
 else if(a==='sugerir'){st.ativ=defAtiv(st.destino,st.tipo,st.querJet);upd('Passeios sugeridos')}
 else if(a==='regerar'){const c=st.rt?st.rt.days.flatMap(d=>d.items.filter(x=>x.custom).map(x=>({...x,date:d.date}))):[];st.rt=null;const R=rt();c.forEach(x=>{const d=R.days.find(d=>d.date===x.date);if(d){const{date,...y}=x;d.items.push(y);d.items.sort((p,q)=>p.h.localeCompare(q.h))}});upd('Roteiro refeito')}

 else if(a==='deldep'){st.depositos.splice(+b.dataset.i,1);upd()}

 else if(a==='limparlistas'){for(const k of Object.keys(st.checks))if(!k.startsWith('pre'))delete st.checks[k];upd()}
 else if(a==='backup'){const blob=new Blob([JSON.stringify(st,null,1)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download=`rumo-backup-${iso(new Date())}.json`;document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(l.href);l.remove()},500);toast('Backup baixado')}
 else if(a==='reset'){if(b.dataset.c){st=Object.assign(def(),{quiz:false,fav:{},pacote:''});st.exemplo=false;diaSel=null;save();render();toast('Tudo zerado')}else{b.dataset.c='1';b.textContent='Toque de novo para confirmar';setTimeout(()=>{if(b.isConnected){delete b.dataset.c;b.textContent='Recomeçar do zero'}},4000)}}

});
/* instalação e rede */
let pedidoInstalar=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pedidoInstalar=e;$('#instalar').hidden=false});
$('#instalar').addEventListener('click',async()=>{if(!pedidoInstalar)return;pedidoInstalar.prompt();await pedidoInstalar.userChoice.catch(()=>{});pedidoInstalar=null;$('#instalar').hidden=true});
window.addEventListener('appinstalled',()=>{$('#instalar').hidden=true;toast('Rumo instalado!')});
function rede(){$('#offline').hidden=navigator.onLine}
addEventListener('online',rede);addEventListener('offline',rede);rede();
if(IS_PWA&&'serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
if(!st.quiz&&st.exemplo)setTimeout(()=>{if(!qz&&rota==='explorar')abrirQuiz()},700);
</script>
